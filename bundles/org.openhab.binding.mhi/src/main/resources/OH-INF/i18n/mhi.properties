# binding
binding.mhi.name = MHI Aircon Binding
binding.mhi.description = Native binding for Mitsubishi Heavy Industries (MHI) WF-RAC Wi-Fi air conditioning units. Talks directly to the units over their local HTTP API and preserves the "spam mode" command debouncing behaviour.

# thing types
thing-type.mhi.aircon.label = MHI Aircon
thing-type.mhi.aircon.description = A single Mitsubishi Heavy Industries WF-RAC air conditioning unit.

# thing type config
thing-type.config.mhi.aircon.hostname.label = Hostname
thing-type.config.mhi.aircon.hostname.description = Hostname or IP address of the aircon unit.
thing-type.config.mhi.aircon.port.label = Port
thing-type.config.mhi.aircon.port.description = Port the aircon unit listens on.
thing-type.config.mhi.aircon.deviceId.label = Device ID
thing-type.config.mhi.aircon.deviceId.description = Device ID (MAC style identifier) of the aircon unit.
thing-type.config.mhi.aircon.operatorId.label = Operator ID
thing-type.config.mhi.aircon.operatorId.description = Operator ID used when registering with the unit.
thing-type.config.mhi.aircon.refreshInterval.label = Refresh Interval
thing-type.config.mhi.aircon.refreshInterval.description = How often (in seconds) the unit is polled for its state.
thing-type.config.mhi.aircon.spamMode.label = Spam Mode
thing-type.config.mhi.aircon.spamMode.description = When enabled, commands are sent to the unit immediately. When disabled, rapid consecutive changes are coalesced so only the final state is sent after the debounce interval.
thing-type.config.mhi.aircon.spamModeInterval.label = Spam Mode Interval
thing-type.config.mhi.aircon.spamModeInterval.description = Debounce window in milliseconds used when spam mode is disabled.

# channel types
channel-type.mhi.power.label = Power
channel-type.mhi.power.description = Turns the aircon unit on or off.
channel-type.mhi.mode.label = Operation Mode
channel-type.mhi.mode.description = The operating mode of the unit.
channel-type.mhi.mode.state.option.auto = Auto
channel-type.mhi.mode.state.option.cool = Cool
channel-type.mhi.mode.state.option.heat = Heat
channel-type.mhi.mode.state.option.dry = Dry
channel-type.mhi.mode.state.option.fan = Fan
channel-type.mhi.fanSpeed.label = Fan Speed
channel-type.mhi.fanSpeed.description = The fan speed of the unit.
channel-type.mhi.vaneUpDown.label = Vane Up/Down
channel-type.mhi.vaneUpDown.description = Vertical air flow direction (0 = swing, 1-4 = fixed positions).
channel-type.mhi.vaneLeftRight.label = Vane Left/Right
channel-type.mhi.vaneLeftRight.description = Horizontal air flow direction (0 = swing, 1-7 = fixed positions).
channel-type.mhi.targetTemperature.label = Target Temperature
channel-type.mhi.targetTemperature.description = The set point temperature.
channel-type.mhi.indoorTemperature.label = Indoor Temperature
channel-type.mhi.indoorTemperature.description = The temperature measured inside.
channel-type.mhi.outdoorTemperature.label = Outdoor Temperature
channel-type.mhi.outdoorTemperature.description = The temperature measured outside.
channel-type.mhi.electric.label = Power Consumption
channel-type.mhi.electric.description = The instantaneous electrical power draw.
channel-type.mhi.errorCode.label = Error Code
channel-type.mhi.errorCode.description = The current error code reported by the unit ("00" = no error).
channel-type.mhi.entrust.label = Entrust
channel-type.mhi.entrust.description = Entrust (auto-adjust / "leave it to me") mode.
channel-type.mhi.vacant.label = Vacant
channel-type.mhi.vacant.description = Vacancy / away mode.
channel-type.mhi.coolHotJudge.label = Cool/Hot Judge
channel-type.mhi.coolHotJudge.description = Cool/hot judgement flag.
channel-type.mhi.selfCleanOperation.label = Self-Clean Operation
channel-type.mhi.selfCleanOperation.description = Self-clean operation state.
channel-type.mhi.selfCleanReset.label = Self-Clean Reset
channel-type.mhi.selfCleanReset.description = Resets the self-clean function.
